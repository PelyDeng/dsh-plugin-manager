<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>封闭化管理智能助手</title>
<link rel="stylesheet" href="/closedoff-qa/assets/app.css">
<link rel="stylesheet" href="/closedoff-qa/assets/chat-base.css">
<link rel="stylesheet" href="/closedoff-qa/assets/cesium/Widgets/widgets.css?v=1.142.0">
<link rel="stylesheet" href="/closedoff-qa/assets/video-player/style.css?v=0.0.37">
</head>
<body>
<header>
  <div class="logo">封</div>
  <div class="brand">
    <div class="title">封闭化管理智能助手</div>
    <div class="subtitle">预约审批 · 人车物定位追踪 · 园区路网 · 预警报警</div>
  </div>
  <div class="spacer"></div>
  <span id="currentUser" class="account-label" aria-live="polite"></span>
  <a class="btn" id="accountLink" href="/auth" hidden>账号</a>
  <button class="btn" id="logoutBtn" type="button" hidden>退出</button>
  <button class="btn" id="historyBtn" type="button">历史对话</button>
  <div class="pill" id="statusPill"><span class="dot" id="statusDot"></span><span id="statusText">智能体就绪</span></div>
  <button class="btn" id="newBtn" title="开始新对话" aria-label="开始新对话">＋ 新对话</button>
  <button class="btn" id="clearBtn" title="清空当前对话" aria-label="清空当前对话">清空</button>
</header>

<div class="main">
  <div class="chat-col">
    <div id="messages"><div class="inner" id="inner"></div></div>
    <div class="composer">
      <div class="composer-inner">
        <div class="input-box">
          <textarea id="input" rows="1" placeholder="请输入您的问题，例如：今天有哪些待审批的危化车预约？"></textarea>
          <div id="model-picker"></div><div class="hint">Enter 发送 · Shift+Enter 换行 · 智能体会自动调用园区业务接口取数并分析</div>
        </div>
        <button class="send" id="sendBtn" title="发送"><svg class="ic" viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg></button>
      </div>
    </div>
  </div>

  <aside class="side">
    <h4>快捷提问 · 园区概览</h4>
    <button class="q-item" data-q="园区现在整体情况怎么样？">园区现在整体情况怎么样？</button>
    <button class="q-item" data-q="今天共有多少预约？各类型分别是多少？">今天共有多少预约？</button>
    <button class="q-item" data-q="今天预约审批情况如何（待审数、通过率）？">今天预约审批情况如何？</button>
    <h4>快捷提问 · 预约审批</h4>
    <button class="q-item" data-q="现在有哪些待审批的预约？">现在有哪些待审批的预约？</button>
    <button class="q-item" data-q="有哪些危化车预约正在等待园区审批？">危化车预约待园区审批的有哪些？</button>
    <button class="q-item" data-q="最近有哪些预约被企业或园区驳回？">最近有哪些预约被驳回？</button>
    <h4>快捷提问 · 车辆轨迹</h4>
    <button class="q-item" data-q="现在园区里有哪些车辆？">现在园区里有哪些车辆？</button>
    <button class="q-item" data-q="查一下云A7D00M 今天的行驶轨迹">查一下「云A7D00M」今天的行驶轨迹</button>
    <h4>快捷提问 · 预警报警</h4>
    <button class="q-item" data-q="现在有哪些还在持续的报警？">现在有哪些还在持续的报警？</button>
    <button class="q-item" data-q="最近有哪些危化车相关的报警？">最近有哪些危化车相关的报警？</button>
    <h4>快捷提问 · 路网停车</h4>
    <button class="q-item" data-q="园区有哪些控制区/电子围栏？">园区有哪些控制区/电子围栏？</button>
    <button class="q-item" data-q="园区有哪些停车区？各还有多少空位？">园区停车区还有多少空位？</button>
    <h4>使用提示</h4>
    <div class="tips">
      <b>提问建议：</b><br>
      · 问题里带上<b>车牌号、时间、企业名</b>等具体条件，回答更精准<br>
      · 时间格式：2026-09-02 09:00:00<br>
      · 可追问：「只看危化车」「今天的数据」<br>
      · 数据来自园区业务系统实时接口
    </div>
  </aside>
</div>

<div id="modal3d" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal3dTitle" style="display:none">
  <div class="modal">
    <div class="modal-head"><span id="modal3dTitle">三维轨迹</span><button id="modal3dClose" class="modal-close" type="button" aria-label="关闭三维轨迹">×</button></div>
    <div class="modal-body"><div class="modal-stage"><div id="modal3dCanvas" class="modal-map"></div><aside id="modal3dLegend" class="track-legend" aria-label="轨迹设备组"></aside></div></div>
    <div class="modal-foot"><span id="modal3dFoot" class="modal-foot-copy"></span><div class="modal-capture"><span id="modal3dCaptureStatus" class="capture-status" role="status" aria-live="polite"></span><button id="modal3dCapture" class="track-3d-btn" type="button" disabled></button></div></div>
  </div>
</div>

<div id="cameraModal" class="modal-overlay camera-overlay" role="dialog" aria-modal="true" aria-labelledby="cameraModalTitle" style="display:none">
  <div class="camera-modal">
    <div class="modal-head"><span id="cameraModalTitle">设备组摄像头</span><button id="cameraModalClose" class="modal-close" type="button" aria-label="关闭摄像头详情">×</button></div>
    <div class="camera-body">
      <aside class="camera-sidebar" aria-label="摄像头列表">
        <div id="cameraStats" class="camera-stats"></div>
        <input id="cameraSearch" class="camera-search" type="search" placeholder="搜索摄像头名称或编码" aria-label="搜索摄像头名称或编码">
        <div id="cameraList" class="camera-list"></div>
      </aside>
      <section class="camera-main">
        <div class="camera-toolbar"><span id="cameraSelectedName" class="camera-selected-name">摄像头</span><span id="cameraSelectedStatus" class="camera-online"></span></div>
        <div class="camera-detail"><div id="cameraPreview" class="camera-preview"></div><dl id="cameraInfo" class="camera-info"></dl></div>
        <div class="camera-strip-title">同组摄像头</div>
        <div id="cameraStrip" class="camera-strip"></div>
      </section>
    </div>
  </div>
</div>

<script>window.CLOSEDOFF_CONFIG = __WEB_CONFIG__;</script>
<script src="/closedoff-qa/assets/trajectory.js"></script>
<script src="/closedoff-qa/assets/model-picker.js"></script>
<script type="module" src="/closedoff-qa/assets/app.js"></script>
</body>
</html>
