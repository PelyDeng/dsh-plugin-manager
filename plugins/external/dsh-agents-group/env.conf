# dsh-agents-group 项目配置
#
# 本项目及其全部子 Agent（封闭化 closedoff、博客 blog）的配置都写在这里，用注释分段区分。
# 子 Agent 不另建 env.conf；只有成为独立项目时才另有一份。
#
# 生效路径：站点部署时，本项目在站点里的实际值维护在仓库根 .local/env.conf 的
# DSH_PLUGIN_CONFIG.agents-group，构建时派生到 <DSH 主目录>/plugins/agents-group/env.conf；
# 群组装配读其中各 Agent 的小节，存储层读顶层 dsn。本文件是同一份配置在项目内的权威形态，
# 也是填写站点配置的依据。
#
# 随包分发的模板是 config/group.example.json——归档不得包含名为 env.conf 的包资源，
# 所以那份模板不能改用本文件名。

# ── 群组级：业务库连接 ────────────────────────────────────────────────
# 群组内各 Agent 共用一个库，表按插件前缀平铺（博客用 blog_ 前缀）；每群组独立数据库与运行账号。
# 存储层认两种写法：本行的 KEY=VALUE，或 {"dsn":"postgresql://…"}。
AGENTS_GROUP_PG_DSN=postgresql://用户:密码@主机:5432/库名

# ── 封闭化 closedoff ─────────────────────────────────────────────────
# 园区业务网关与两阶段认证；字段名与 CLOSEDOFF_* 环境变量一致，在群组配置里对应 closedoff 小节。
# closedoff 独立运行（用 CLOSEDOFF_ENV_CONF 指向一份文件）时用的也是这些字段。
CLOSEDOFF_BASE_URL=https://your-gateway.example/
CLOSEDOFF_OPEN_CLIENT_ID=REPLACE_ME
CLOSEDOFF_OPEN_CLIENT_SECRET=REPLACE_ME
CLOSEDOFF_APP_CODE=REPLACE_ME
CLOSEDOFF_APP_CLIENT_ID=REPLACE_ME
CLOSEDOFF_APP_CLIENT_SECRET=REPLACE_ME
CLOSEDOFF_USERNAME=REPLACE_ME

# ── 博客 blog ────────────────────────────────────────────────────────
# 博客站点、图床、备份回调与模型选择；在群组配置里对应 blog 小节，是嵌套结构，用单行 JSON。
# 备份执行器另有一份独立配置，见 agents/blog/backup/config.example.json。
AGENTS_GROUP_BLOG={"schemaVersion":1,"models":{"text":{"provider":"zhipu","model":"glm-5.3"},"vision":{"provider":"zhipu","model":"glm-5v-turbo"}},"blog":{"url":"https://blog.example.com","username":"","password":""},"image":{"url":"https://images.example.com","username":"","password":"","strategyId":2,"maxBytes":10485760},"backup":{"url":"http://127.0.0.1:7913","token":"","allowedUserIds":[]}}
