<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>牛马台账 · 大总管群聊</title>
<link rel="stylesheet" href="/butler/assets/fonts-lxgw.css">
<link rel="stylesheet" href="/butler/assets/style.css">
</head>
<body data-drawer="closed" data-sidebar="closed">
<div class="shell">

  <header class="topbar">
    <button type="button" class="btn btn--ghost sidebar-toggle" id="sidebar-toggle" aria-label="打开任务记录" aria-expanded="false">☰</button>
    <span class="topbar__dots" aria-hidden="true"><i></i><i></i><i></i></span>
    <h1 class="topbar__brand">牛马台账</h1>
    <p class="topbar__motto">牛马虽苦，但一起干，<br>　　就不孤单了~加油!</p>
    <span class="topbar__status"><span class="dot dot--online" aria-hidden="true"></span><span id="top-status">已上线</span></span>
    <span class="spacer"></span>
    <p class="topbar__slogan">把重复的事，<span class="red-wavy">交给牛马们!</span></p>
    <span class="topbar__smile" aria-hidden="true">☺</span>
    <span class="identity" id="identity"></span>
    <button type="button" class="btn btn--ghost drawer-toggle" id="drawer-toggle" aria-label="打开成员档案" aria-expanded="false">🐮</button>
  </header>

  <div class="columns desk">

    <aside class="column column--left" id="left-panel" tabindex="-1" aria-label="任务记录">
      <div class="left__top">
        <div class="brand">
          <svg class="brand__badge" viewBox="0 0 34 32" aria-hidden="true">
            <path d="M17 2.6 C 18 6.2, 19 8.4, 21.4 9.6 C 24.2 10.8, 27.4 10.6, 30.8 10 C 28.6 12.8, 27.2 15, 26.8 17.4 C 26.4 19.8, 27.2 22.4, 28.8 25.4 C 25.6 24.4, 23 24.2, 20.6 25.2 C 18.2 26.2, 16.4 28.2, 14.6 30.4 C 14.2 27, 13.4 24.6, 11.6 22.8 C 9.8 21, 7.2 20, 3.6 19.6 C 6.6 17.6, 8.6 15.6, 9.6 13.2 C 10.6 10.8, 10.4 8, 9.4 4.8 C 12.4 6.4, 14.8 6.8, 17 2.6 Z" fill="#ffb703" stroke="#4a423a" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
          <h2 class="brand__title" aria-label="牛马台账">
            <img src="/butler/assets/media/titles/title-left.png" alt="" height="58">
          </h2>
          <svg class="brand__wave" viewBox="0 0 150 8" preserveAspectRatio="none" aria-hidden="true">
            <path d="M2 5 C 15 1, 28 8, 42 4 S 70 1, 84 5 S 112 8, 126 4 S 142 2, 148 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
          <div class="left__brandline" id="crew-line">—</div>
        </div>
        <div class="left__actions">
          <label class="visually-hidden" for="chat-search">搜索任务记录</label>
          <input type="search" id="chat-search" class="doodle-input" placeholder="搜索任务记录" autocomplete="off">
          <button type="button" class="btn btn--primary btn--chunky" id="new-chat">＋ 新建</button>
        </div>
        <h2 class="section-title">任务记录</h2>
      </div>
      <div class="left__list" id="chat-list"></div>
      <div class="crew">
        <h2 class="section-title">我的成员</h2>
        <div class="crew__row">
          <div class="crew__faces" id="crew-faces"></div>
          <div class="crew__cheers" aria-hidden="true">好的<br>牛马们！<br>辛苦啦! ♡</div>
        </div>
        <div class="crew__line" id="crew-note">—</div>
      </div>
    </aside>

    <main class="column column--center" aria-label="牛马调度群">
      <div class="center__head">
        <h2 class="center__title" aria-label="牛马调度群">
          <svg class="center__circle" viewBox="0 0 190 46" preserveAspectRatio="none" aria-hidden="true">
            <path d="M22 8 C 60 2, 150 2, 172 10 C 188 17, 186 30, 164 37 C 128 45, 52 44, 24 38 C 4 32, 4 18, 22 8 Z" fill="none" stroke="var(--bt-red)" stroke-width="2.8" stroke-linecap="round"/><path d="M30 6 C 70 1, 150 3, 170 12" fill="none" stroke="var(--bt-red)" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
          </svg>
          <img src="/butler/assets/media/titles/title-center.png" alt="" height="74">
        </h2>
        <span class="center__sub" id="group-sub">—</span>
        <span class="spacer"></span>
        <button type="button" class="btn btn--tiny btn--ghost" id="stop-button" hidden>喊停</button>
        <button type="button" class="icon-btn" id="settings-button" title="设置" aria-label="设置" aria-expanded="false">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="3.1" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M10 2 v2.4 M10 15.6 V18 M2 10 h2.4 M15.6 10 H18 M4.2 4.2 l1.7 1.7 M14.1 14.1 l1.7 1.7 M15.8 4.2 l-1.7 1.7 M5.9 14.1 l-1.7 1.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="thread-wrap">
        <div class="thread" id="thread"></div>
        <!-- 跟随暂停时出现（C 批 I11）：点一下回到最新并恢复跟随。 -->
        <button type="button" class="jump-latest" id="jump-latest" hidden>↓ 回到最新</button>
      </div>
      <form class="composer" id="composer">
        <!-- 待发附件条：选文件、拖进来、粘链接都落到这里。内容由 app.js 画。
             放在输入框**上面**（`.composer__box` 外面）：那一块是 flex 行布局，塞进去会跟
             输入框并排，不是叠在上面。 -->
        <div class="attach" id="attach-strip" hidden>
          <div class="attach__items" id="attach-items"></div>
          <!-- 粘链接的入口：点链接按钮才出现，回车即取回。 -->
          <div class="attach__url" id="attach-url" hidden>
            <input type="url" id="attach-url-input" placeholder="粘贴文件或图片的链接，回车取回" autocomplete="off" spellcheck="false">
            <button type="button" class="btn btn--tiny btn--ghost" id="attach-url-cancel">取消</button>
          </div>
        </div>
        <div class="composer__box">
          <!-- @ 提及选择器：输入 @ 时翻出的点名簿（行为在 app.js 的 mention 一节）。 -->
          <div class="mention" id="mention-pop" role="listbox" aria-label="点名成员" hidden>
            <p class="mention__hint" aria-hidden="true">↑↓ 选 · 回车点名 · Esc 关</p>
            <div class="mention__items" id="mention-items"></div>
          </div>
          <label class="visually-hidden" for="message-input">说句话</label>
          <textarea id="message-input" rows="1" placeholder="说说你要做什么" autocomplete="off"></textarea>
          <div class="composer__actions">
            <button type="button" class="doodle-btn" id="at-button" title="插入 @，点名成员" aria-label="插入 @">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M13.6 5.4 C 12.4 4.2, 10.8 3.8, 9.2 4.4 C 6.4 5.4, 4.8 8.2, 5.6 11 C 6.4 13.8, 9.2 15.4, 12 14.6 C 13.4 14.2, 14.4 13.2, 14.9 12 M14.6 8.4 C 14.9 9.9, 14.7 11.5, 15.4 12.6 C 16 13.4, 17.2 13.2, 17.8 12.2 C 18.9 10.2, 18.6 7.4, 16.9 5.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </button>
            <!-- 回形针：选文件。拖拽与粘贴也走同一条路（挂在整块输入区上）。 -->
            <button type="button" class="doodle-btn" id="attach-button" title="上传文件（也可以直接把文件拖进来）" aria-label="上传文件">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M13.4 8.2 9 12.6 C 8 13.6, 8 15, 9 15.8 C 10 16.7, 11.4 16.6, 12.3 15.7 L 16.6 11.3 C 18.2 9.7, 18.2 7.2, 16.6 5.7 C 15 4.2, 12.5 4.3, 10.9 5.8 L 6.5 10.2 C 4.9 11.7, 4.9 14.3, 6.4 15.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <!-- 链接：把远处的文件或图片取回来，和上传落到同一条路。 -->
            <button type="button" class="doodle-btn" id="attach-link-button" title="粘贴链接，把远处的文件取回来" aria-label="从链接取回文件">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M8.4 11.6 C 7.2 10.4, 7.3 8.5, 8.5 7.3 L 11 4.8 C 12.2 3.6, 14.1 3.6, 15.3 4.8 C 16.5 6, 16.5 7.9, 15.3 9.1 L 14.2 10.2 M11.6 8.4 C 12.8 9.6, 12.7 11.5, 11.5 12.7 L 9 15.2 C 7.8 16.4, 5.9 16.4, 4.7 15.2 C 3.5 14, 3.5 12.1, 4.7 10.9 L 5.8 9.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
            <input type="file" id="attach-input" multiple hidden>
            <button type="submit" class="send" id="send-button" aria-label="发送">
              <svg width="20" height="18" viewBox="0 0 20 18" fill="none" aria-hidden="true">
                <path d="M18.2 2.2 C 12.6 4.6, 7 7.4, 2.4 10.2 C 5.2 11.2, 7.6 12.2, 9.6 13.4 C 12.4 9.6, 15.2 5.8, 18.2 2.2 Z M9.6 13.4 C 10 12.4, 10.6 10.8, 11.4 9 C 13.6 6.6, 15.8 4.4, 18.2 2.2 Z" fill="#fff"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="composer__hint">
          <span id="composer-hint">牛马大总管<span class="red-wavy">先听明白需求</span>，再替你分派成员</span>
          <span id="composer-count"></span>
        </div>
      </form>
    </main>

    <aside class="column column--right" id="drawer" tabindex="-1" aria-label="成员档案">
      <section>
        <div class="panel">
          <h2 class="section-title section-title--members">成员档案</h2>
          <div id="member-list"></div>
        </div>
      </section>

      <section>
        <div class="panel">
          <h2 class="section-title section-title--metrics">运行状态</h2>
          <!-- 只有计数：本次派活的逐人状态在群里的调度卡上（唯一来源），这里不再重复一列。 -->
          <div class="metrics" id="metrics"></div>
        </div>
      </section>

      <section>
        <div class="panel">
          <h2 class="section-title section-title--failures">失败记录</h2>
          <div class="failure-note"><div id="failure-list"></div></div>
        </div>
      </section>

      <div class="motto" id="motto"></div>
    </aside>
  </div>

  <section class="settings paper" id="settings" hidden aria-label="设置">
    <div class="settings__head">
      <button type="button" class="btn" id="settings-back">← 回群聊</button>
      <h2 class="settings__title" id="settings-title" tabindex="-1">设置</h2>
      <span class="settings__note">改外号、换头像、挑配色，只在你这里生效，不影响插件自己声明的身份。</span>
      <!-- 执行中进设置：停止入口被页面切换挡住了，这里给出路（方案 I18）。 -->
      <span class="settings__live" id="settings-live-note" hidden></span>
    </div>
    <div class="settings__grid" id="settings-members"></div>
  </section>
</div>
<div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
<!-- 关键状态播报（方案 6.2）：只报提交/等待/停止/收尾，正文不进这里。 -->
<div class="visually-hidden" id="sr-status" role="status" aria-live="polite"></div>

<script type="module" src="/butler/assets/app.js"></script>
</body>
</html>
