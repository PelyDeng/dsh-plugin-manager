<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>拾问 · AI 对话示例</title>
  <link rel="stylesheet" href="__BASE__/style.css">
  <script type="module" src="__BASE__/app.js"></script>
</head>
<body data-base="__BASE__">
  <aside class="sidebar">
    <a class="brand" href="__BASE__"><span class="brand-mark">拾</span><span>拾问 <small>AI 对话示例</small></span></a>
    <button class="new-chat" id="new-chat"><span aria-hidden="true">＋</span> 新建对话 <kbd>NEW</kbd></button>
    <details class="history-panel" open><summary id="history-label">历史对话</summary><div id="history-list"></div><button id="more-history" hidden>加载更多</button></details>
    <div class="sidebar-bottom"><span class="status-dot"></span><span id="access-mode">正在连接…</span><a id="auth-link" href="/auth" hidden>账号</a></div>
  </aside>
  <main>
    <header class="topbar"><span>你的日常 AI 助手</span><span class="badge">DSH · EXAMPLE</span></header>
    <div class="scroll-area" id="scroll-area">
      <section class="welcome" id="welcome">
        <span class="welcome-icon" aria-hidden="true">✳</span>
        <p class="eyebrow">留一点空间，给新的想法</p>
        <h1>今天，想聊些什么？</h1>
        <p class="intro">一个问题，一段对话。一起把复杂的事想明白。</p>
        <div class="suggestions" aria-label="快捷提问">
          <button data-question="请用一个生活中的例子解释什么是大语言模型。"><span class="card-icon">◈</span><strong>理解一个概念</strong><span>用生活中的例子解释大语言模型</span><i aria-hidden="true">↗</i></button>
          <button data-question="帮我制定一个七天的 AI 入门学习计划，每天约三十分钟。"><span class="card-icon">▦</span><strong>制定学习计划</strong><span>每天 30 分钟，开始学习 AI</span><i aria-hidden="true">↗</i></button>
          <button data-question="我想写一封简洁、礼貌的会议邀请邮件。请先告诉我需要提供哪些信息。"><span class="card-icon">✎</span><strong>写得更清楚</strong><span>从一封礼貌的会议邀请开始</span><i aria-hidden="true">↗</i></button>
        </div>
      </section>
      <section id="messages" class="messages" role="log" aria-label="对话记录" aria-live="off"></section>
    </div>
    <div class="composer-wrap">
      <div class="notice" id="notice" role="alert" hidden></div>
      <form id="chat-form" class="composer">
        <label class="sr-only" for="prompt">输入问题</label>
        <textarea id="prompt" rows="2" maxlength="8000" placeholder="写下你的问题，也可以接着聊…" required></textarea>
        <div class="composer-actions"><span>Enter 发送 <span class="divider">·</span> Shift + Enter 换行</span><button id="stop" type="button" hidden>■ 停止生成</button><button id="send" type="submit" aria-label="发送问题">发送 <span aria-hidden="true">↑</span></button></div>
      </form>
      <div class="footer"><span id="status" role="status">对话自动保存，可以从历史继续</span><span>AI 的回答可能不准确，请核实重要信息</span></div>
    </div>
  </main>
</body>
</html>
