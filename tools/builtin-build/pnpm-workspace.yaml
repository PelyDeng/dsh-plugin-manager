packages:
  - 'packages/*'
  - 'plugins/builtin/*'
  - 'plugins/external/*'
nodeLinker: hoisted
# 宿主内部包随 dsh 版本一起发布，npm 的 minimumReleaseAge 冷静期会拦下刚发布的版本。
# pnpm 的豁免只接受精确版本的并集（不支持区间），宿主升级时在这里并列新旧版本；
# scripts/version.mjs check 会核验清单与子模块版本一致。
minimumReleaseAgeExclude:
  - "@deepseek-ai/dsh-session-format-v2-to-v3@0.1.6-alpha.1 || 0.1.6-alpha.2 || 0.1.7-alpha.2"
  - '@deepseek-ai/dsh-session-format-v3-to-v4@0.1.7-alpha.2'
  - "@deepseek-ai/dsh-session-format-catalog@0.1.6-alpha.1 || 0.1.6-alpha.2 || 0.1.7-alpha.2"
  - '@deepseek-ai/dsh-agent-default-model@0.1.6-alpha.1 || 0.1.6-alpha.2 || 0.1.7-alpha.2'
  - '@deepseek-ai/dsh-agent@0.1.6-alpha.1 || 0.1.6-alpha.2 || 0.1.7-alpha.2'
  - '@deepseek-ai/dsh-attachment@0.1.6-alpha.1 || 0.1.6-alpha.2 || 0.1.7-alpha.2'
  - '@deepseek-ai/dsh-brand@0.1.6-alpha.1 || 0.1.6-alpha.2 || 0.1.7-alpha.2'
  - '@deepseek-ai/dsh-credentials@0.1.6-alpha.1 || 0.1.6-alpha.2 || 0.1.7-alpha.2'
  - '@deepseek-ai/dsh-host-webserver@0.1.6-alpha.1 || 0.1.6-alpha.2 || 0.1.7-alpha.2'
  - '@deepseek-ai/dsh-invariants@0.1.6-alpha.1 || 0.1.6-alpha.2 || 0.1.7-alpha.2'
  - '@deepseek-ai/dsh-llm@0.1.6-alpha.1 || 0.1.6-alpha.2 || 0.1.7-alpha.2'
