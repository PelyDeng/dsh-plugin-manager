name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres-contracts:
    # PostgreSQL 门控契约测试（无 DSN 时自动跳过的那批）在真实 PG 上跑一遍。
    # 独立 job 的原因：service 容器只在 Linux runner 可用，现有三系统矩阵保持原样。
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BUTLER_TEST_PG_DSN: postgresql://postgres:ci@127.0.0.1:5432/butler_test
      AGENTS_GROUP_TEST_PG_DSN: postgresql://postgres:ci@127.0.0.1:5432/agents_group_test
      AGENTS_GROUP_MIGRATE_PG_DSN: postgresql://postgres:ci@127.0.0.1:5432/agents_group_mig
      DSH_RUNTIME_TEST_PG_DSN: postgresql://postgres:ci@127.0.0.1:5432/agents_group_runtime_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Create test databases
        run: |
          for db in butler_test agents_group_test agents_group_mig agents_group_runtime_test; do
            psql "postgresql://postgres:ci@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db"
          done
      - name: Butler PG contracts
        # storage-postgres 与 acceptance 共用 butler_test 且各自重建 schema，必须串行。
        run: pnpm --dir plugins/external/dsh-butler-console exec vitest run --no-file-parallelism tests/storage-postgres.smoke.test.ts tests/acceptance-pg-contract.test.ts
      - name: Runtime PG contracts
        # 运行时存储契约**独占** agents_group_runtime_test：它会 DROP SCHEMA public 重建结构，
        # 与别的用例共用库会互相破坏（实测：放进 agents_group_test 会让两个无关用例变红）。
        run: pnpm --dir plugins/external/dsh-agents-group exec vitest run tests/storage-contract.test.ts
      - name: Group PG contracts
        run: pnpm --dir plugins/external/dsh-agents-group exec vitest run tests/migrate-blog-storage.test.ts
      - name: Blog PG contracts
        run: node --test plugins/external/dsh-agents-group/agents/blog/tests/pg-smoke.test.mjs
  public-workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/version.mjs check
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Test release scripts
        id: script-tests
        shell: bash
        run: node --test --test-reporter=tap scripts/tests/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/script-tests.log"
      - name: Test workspace
        id: tests
        if: runner.os != 'Windows'
        shell: bash
        run: pnpm -r --workspace-concurrency=1 --if-present test 2>&1 | tee "$RUNNER_TEMP/workspace-tests.log"
      - name: Test workspace on Windows
        id: windows-tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pnpm -r --workspace-concurrency=1 --if-present test 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/workspace-tests.log"
          exit $LASTEXITCODE
      - name: Summarize test failures
        if: failure() && (steps.script-tests.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.windows-tests.outcome == 'failure')
        shell: bash
        env:
          TEST_LOG: ${{ steps.script-tests.outcome == 'failure' && 'script-tests.log' || 'workspace-tests.log' }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const lines = readFileSync(join(process.env.RUNNER_TEMP, process.env.TEST_LOG), 'utf8').split('\n');
          const first = lines.findIndex(line => /not ok|✖/.test(line));
          const excerpt = [...lines.slice(Math.max(0, first - 2), first + 65), ...lines.slice(-90)].join('\n').slice(-14000);
          console.log('::error::' + excerpt.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A'));
          JS
      - run: node scripts/check-artifacts.mjs
      - run: node scripts/check-repository.mjs
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./packages/plugin-manager/tests/start.test.ps1
