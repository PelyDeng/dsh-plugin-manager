name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres-contracts:
    # PostgreSQL 门控契约测试（无 DSN 时自动跳过的那批）在真实 PG 上跑一遍。
    # 独立 job 的原因：service 容器只在 Linux runner 可用，现有三系统矩阵保持原样。
    #
    # ⚠️ **本 job 的命令清单就是本仓"发版要跑什么"的权威位置**（设计《…最终版》§8 的 P2 判据 ⑥
    # 原话就是"把私有侧存储契约测试加入 `.github/workflows/check.yml` 的命令清单"）。
    # ⇒ **P7 判据 ④**（`test:host` / `bridge` / `reports` 纳入指定的发版清单文件）落在**本文件本 job**，
    # 不是新加一份清单。加命令时请一并想清楚：它要不要 PG（要 ⇒ 放本 job）、要不要构建产物、
    # 要不要额外运行时（如 PHP）。
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BUTLER_TEST_PG_DSN: postgresql://postgres:ci@127.0.0.1:5432/butler_test
      AGENTS_GROUP_TEST_PG_DSN: postgresql://postgres:ci@127.0.0.1:5432/agents_group_test
      AGENTS_GROUP_MIGRATE_PG_DSN: postgresql://postgres:ci@127.0.0.1:5432/agents_group_mig
      DSH_RUNTIME_TEST_PG_DSN: postgresql://postgres:ci@127.0.0.1:5432/agents_group_runtime_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Create test databases
        run: |
          for db in butler_test agents_group_test agents_group_mig agents_group_runtime_test; do
            psql "postgresql://postgres:ci@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db"
          done
      - name: Butler PG contracts
        # storage-postgres 与 acceptance 共用 butler_test 且各自重建 schema，必须串行。
        run: pnpm --dir plugins/external/dsh-butler-console exec vitest run --no-file-parallelism tests/storage-postgres.smoke.test.ts tests/acceptance-pg-contract.test.ts
      - name: Runtime PG contracts
        # 运行时存储契约**独占** agents_group_runtime_test：它会 DROP SCHEMA public 重建结构，
        # 与别的用例共用库会互相破坏（实测：放进 agents_group_test 会让两个无关用例变红）。
        run: pnpm --dir plugins/external/dsh-agents-group exec vitest run tests/storage-contract.test.ts
      - name: Group PG contracts
        run: pnpm --dir plugins/external/dsh-agents-group exec vitest run tests/migrate-blog-storage.test.ts
      - name: Blog PG contracts
        run: node --test plugins/external/dsh-agents-group/agents/blog/tests/pg-smoke.test.ts
      # ---- 以下四步是 P7 判据 ④ 要求纳入发版清单的三条命令（外加它们的前置）----
      - name: Build blog plugin
        # ⚠️ 必须先构建：`test:host` 打的是 `agents/blog/dist/`（`tests/http-fixture.mjs` 里
        # `import { … } from '../dist/index.mjs'`），不构建就是"模块不存在"，而不是用例失败。
        run: pnpm --dir plugins/external/dsh-agents-group/agents/blog build
      - name: Blog host tests (HTTP routes + official SDK projection)
        # 三条真 PG 用例用本 job 已设的 `AGENTS_GROUP_TEST_PG_DSN`（夹具会 `DROP SCHEMA public CASCADE`
        # 重建，**不能与别的用例并发** —— 本 job 的步骤天然串行）。
        # ⚠️ 另有两条离线包用例在本机 / runner 上会因缺 `/opt/dsh-runtime` 而**跳过并写明原因**
        # （见 `tests/chat-backup-native.test.mjs` 的 `SKIP_REASON`）—— **跳过 ≠ 通过**，
        # 那两条的真验证只在部署后的离线备份容器里做，看报告时必须把 skipped 单独计数。
        run: pnpm --dir plugins/external/dsh-agents-group/agents/blog test:host
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # ⚠️ 两个脚本对扩展的要求**不一样**，这一条是本批实测/推断出来的：
          # - `test:bridge` 用 **`php -n`**（不加载 php.ini）⇒ 它**只能**靠 PHP 自带的扩展。
          #   它需要的 `mb_strlen`（`Plugin.php:179/207/304/308`，而 `Plugin.php` **没有 namespace**、
          #   是全局类 ⇒ 解析到**全局** `mb_strlen`）由 `tests/bridge.test.php` 顶部**全局命名空间**里的
          #   兜底提供（本批顺手修掉了原先写在 `namespace Typecho {…}` 里、**根本没生效**的那一份）。
          #   ⇒ 因此这里**不需要**为它额外装扩展；`-n` 也就保住了"不依赖宿主 php.ini"的可复现性。
          # - `test:reports` **不带 `-n`**（走 php.ini），而它要 `new PDO('sqlite::memory:')` 与
          #   `mb_strlen`（`reports-bridge.test.php:64`）⇒ **必须**有 `pdo_sqlite` 与 `mbstring`。
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none
      - name: Blog Typecho bridge tests
        run: pnpm --dir plugins/external/dsh-agents-group/agents/blog test:bridge
      - name: Blog reports tests
        run: pnpm --dir plugins/external/dsh-agents-group/agents/blog test:reports
  public-workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/version.mjs check
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Typecheck external plugins
        # ⚠️ `pnpm check`（`scripts/workspace.mjs check`）**只覆盖框架包与 builtin 插件**：
        # 它以 `--external` 未给 ⇒ `scope='builtin'`、`requested='all'`，于是 `plugins/external/**`
        # **不在任何 typecheck 里**。而私有侧的 `dsh-agents-group`（含 `packages/runtime`——本次重构的
        # 核心，一万多行）与 `dsh-butler-console` 的**代码正确性判据恰恰是"四个 typecheck 全 0"**
        # ⇒ 那条判据必须进 CI，否则它只是本地习惯，CI 绿说明不了它成立。
        # 这里按 workspace 成员的 `typecheck` 脚本逐个跑（`--if-present` 跳过没声明的包）。
        run: pnpm -r --filter "./plugins/external/**" run --if-present typecheck
      - name: Test release scripts
        id: script-tests
        shell: bash
        run: node --test --test-reporter=tap scripts/tests/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/script-tests.log"
      - name: Test workspace
        id: tests
        if: runner.os != 'Windows'
        shell: bash
        run: pnpm -r --workspace-concurrency=1 --if-present test 2>&1 | tee "$RUNNER_TEMP/workspace-tests.log"
      - name: Test workspace on Windows
        id: windows-tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pnpm -r --workspace-concurrency=1 --if-present test 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/workspace-tests.log"
          exit $LASTEXITCODE
      - name: Summarize test failures
        if: failure() && (steps.script-tests.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.windows-tests.outcome == 'failure')
        shell: bash
        env:
          TEST_LOG: ${{ steps.script-tests.outcome == 'failure' && 'script-tests.log' || 'workspace-tests.log' }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const lines = readFileSync(join(process.env.RUNNER_TEMP, process.env.TEST_LOG), 'utf8').split('\n');
          const first = lines.findIndex(line => /not ok|✖/.test(line));
          const excerpt = [...lines.slice(Math.max(0, first - 2), first + 65), ...lines.slice(-90)].join('\n').slice(-14000);
          console.log('::error::' + excerpt.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A'));
          JS
      - run: node scripts/check-artifacts.mjs
      - run: node scripts/check-repository.mjs
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./packages/plugin-manager/tests/start.test.ps1
