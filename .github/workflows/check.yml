name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/version.mjs check
      - run: node --test scripts/tests/version.test.mjs
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - name: Test workspace
        id: tests
        if: runner.os != 'Windows'
        shell: bash
        run: pnpm -r --workspace-concurrency=1 --if-present test 2>&1 | tee "$RUNNER_TEMP/workspace-tests.log"
      - name: Test workspace on Windows
        id: windows-tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pnpm -r --workspace-concurrency=1 --if-present test 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/workspace-tests.log"
          exit $LASTEXITCODE
      - name: Summarize test failures
        if: failure() && (steps.tests.outcome == 'failure' || steps.windows-tests.outcome == 'failure')
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const lines = readFileSync(join(process.env.RUNNER_TEMP, 'workspace-tests.log'), 'utf8').split('\n');
          const first = lines.findIndex(line => /not ok|✖/.test(line));
          const excerpt = [...lines.slice(Math.max(0, first - 2), first + 65), ...lines.slice(-90)].join('\n').slice(-14000);
          console.log('::error::' + excerpt.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A'));
          JS
      - run: node scripts/check-artifacts.mjs
      - run: node scripts/check-repository.mjs
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./packages/plugin-manager/tests/start.test.ps1
