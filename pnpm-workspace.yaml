packages:
  - 'packages/*'
  - 'plugins/builtin/*'
  - 'plugins/external/*'
  # 群组插件内部的子包：每个 Agent 一个，另有共享组件包。
  # 它们不带 deepseekPlugin，因此不会被管理器当成独立插件。
  - 'plugins/external/*/agents/*'
  - 'plugins/external/*/packages/*'
nodeLinker: hoisted
# 宿主内部包随 dsh 版本一起发布，alpha 频率高，逐版本枚举会让每次升级都改这几十行；
# 按 >=区间 豁免第一方 scope 的宿主版本，升级只动 deepseek-harness 子模块指针。
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent-default-model@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-agent@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-attachment@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-brand@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-credentials@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-host-webserver@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-invariants@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-llm@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-scope@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-session-persistence@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-session-projection@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-session@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-settings@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-system-prompt@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-timeout@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-tools@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-typert-protocol@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-user-approval@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-util-crypto@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-util-values@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-anonymous-user-id@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-command-feedback@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-commands@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-compaction@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-home-paths@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-llm-retry@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-message-feedback@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-storage-domain@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-storage@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-token-meter@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-session-format-v0-to-v1@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-session-format-v1-to-v2@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-session-format-v2-to-v3@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-session-format-catalog@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-session-format@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-compaction-image-offload@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-ptc-runtime@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-sandbox-policy@>=0.1.6-alpha.1'
  - '@deepseek-ai/dsh-sandbox@>=0.1.6-alpha.1'
allowBuilds:
  esbuild: true
